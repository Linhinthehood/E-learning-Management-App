name: Build Windows

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create ZIP archive
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../e_learning_management_app-windows.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows/x64/runner/e_learning_management_app-windows.zip
          retention-days: 30

      - name: Create Release and Upload Windows EXE
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/windows/x64/runner/e_learning_management_app-windows.zip
          body: |
            ## Windows Release
            
            **Version:** ${{ github.ref_name }}
            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            
            ### Download
            - Download the ZIP file below
            - Extract to a folder
            - Run `e_learning_management_app.exe`
            
            ### System Requirements
            - Windows 10/11 (64-bit)
            - .NET Framework (included in Windows 10/11)
            
            ### Installation
            1. Download and extract the ZIP file
            2. Run `e_learning_management_app.exe`
            3. No installation required - portable application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
